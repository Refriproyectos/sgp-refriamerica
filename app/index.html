  const notasCargas = (c.areas || []).filter((a) => a.equipos_internos || a.condicion_especial).map((a) =>
    ({ text: [{ text: (a.nombre || 'Área') + ': ', bold: true }, [a.equipos_internos && 'equipos internos: ' + a.equipos_internos, a.condicion_especial && 'condición especial: ' + a.condicion_especial].filter(Boolean).join('; ')], fontSize: 8.5, margin: [0, 0, 0, 3] }));
  const fa = c.facilidades || {}, el = fa.electrica || {};
  const pref = nueva ? 'C' : 'H';

  // Registro fotográfico: dos por fila, como la plantilla
  const celdasFoto = fotos.map((f) => ({ stack: [

  const filasFoto = []; for (let i = 0; i < celdasFoto.length; i += 2) filasFoto.push([celdasFoto[i], celdasFoto[i + 1] || '']);

  const dd = {

    // Un título nunca queda solo al pie de la página
    pageBreakBefore: (nodo) => nodo.headlineLevel === 1 && nodo.startPosition.top > 841.89 - 56 - 110,
    header: (pag) => (pag === 1 ? null : { margin: [50, 26, 50, 0], stack: [
      { columns: [{ image: logoH, width: 105 }, { stack: [{ text: 'Informe de Levantamiento de Campo', bold: true, fontSize: 8.5, color: AZUL, alignment: 'right' },
        { text: `Código: ${codigo}  |  Rev. 0  |  ${fechaEmision}`, fontSize: 7.5, color: GRIS, alignment: 'right' }], margin: [0, 6, 0, 0] }] },
      { canvas: [{ type: 'line', x1: 0, y1: 6, x2: 495, y2: 6, lineWidth: 1.2, lineColor: AZUL2 }, { type: 'line', x1: 0, y1: 8.5, x2: 495, y2: 8.5, lineWidth: 1.2, lineColor: VERDE }] }] }),
    footer: (pag) => (pag === 1 ? null : { margin: [50, 14, 50, 0], stack: [
      { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 495, y2: 0, lineWidth: 0.5, lineColor: LINEA }] },
      { columns: [{ text: 'Grupo RefriAmerica · Ventas, instalación y servicio de sistemas HVAC-R', fontSize: 7.5, color: GRIS },
        { text: 'Página ' + (pag - 1), fontSize: 7.5, color: GRIS, alignment: 'right', width: 60 }], margin: [0, 5, 0, 0] }] }),
    content: [
      // Portada
      { image: logoC, width: 210, alignment: 'center', margin: [0, 40, 0, 70] },
      { text: 'Informe de Levantamiento de Campo', fontSize: 22, bold: true, color: AZUL },
      { text: v.sistemas || (nueva ? 'Sistemas a proyectar' : 'Sistemas inspeccionados'), fontSize: 12, italics: true, color: GRIS, margin: [0, 4, 0, 40] },
      { table: { widths: [130, '*'], body: [
          ['Cliente', v.cliente || '—'], ['Ubicación', v.direccion || '—'], ['Fecha de inspección', fmtFecha(v.fecha) || '—'],
          ['Código del documento', codigo], ['Revisión / Emisión', `0 · ${fechaEmision}`], ['Elaborado por', L.meta?.responsable || estado.perfil.nombre]]
          .map(([k, x]) => [{ text: k, bold: true, color: AZUL }, { text: x }]) },
        layout: { hLineWidth: (i) => (i === 0 ? 0 : 0.5), vLineWidth: () => 0, hLineColor: () => LINEA, paddingTop: () => 6, paddingBottom: () => 6 }, margin: [30, 0, 30, 0] },
      ...(!aprobado ? [{ text: 'BORRADOR · no válido para emisión hasta su aprobación por la Coordinación de Proyectos', color: '#B00020', bold: true, fontSize: 9, margin: [30, 18, 30, 0] }] : []),
      { text: 'Documento técnico de uso exclusivo del cliente. Su reproducción parcial requiere autorización de Grupo RefriAmerica.', italics: true, fontSize: 8, color: GRIS, margin: [0, 60, 0, 0] },

      // Control del documento
      { text: 'Control del documento', style: 'h1', pageBreak: 'before', margin: [0, 0, 0, 5] },
      tabla(['Rev.', 'Fecha', 'Descripción', 'Elaboró', 'Revisó / Aprobó'],
        [['0', aprobado ? fechaEmision : '', 'Emisión original', iniciales(L.meta?.responsable || estado.perfil.nombre), aprobado ? iniciales(L.meta?.aprobador) : '']], [30, 70, '*', 70, 85]),

      h1('1. Datos generales'),
      claveValor([['Cliente / razón social', v.cliente], ['RIF', v.rif], ['Dirección', v.direccion], ['Persona de contacto', v.contacto],
        ['Tipo de instalación', v.tipo_instalacion], ['Fecha y horario de la visita', [fmtFecha(v.fecha), [v.hora_inicio, v.hora_fin].filter(Boolean).join(' a ')].filter(Boolean).join(' · ')],
        ['Responsable de la inspección', L.meta?.responsable || estado.perfil.nombre], ['Personal de apoyo', v.personal_apoyo],
        ['Ubicación GPS', v.gps ? `${v.gps.lat}, ${v.gps.lon} (±${v.gps.precision} m)` : '']]),
      h2(nueva ? '1.1 Áreas del sitio' : '1.1 Áreas inspeccionadas'),
      tabla(['Área / nivel', 'Uso', 'Largo (m)', 'Ancho (m)', 'Alto (m)', 'Área (m²)', 'Ocup.', 'Observación'], areas, ['*', 60, 38, 38, 36, 42, 32, '*']),
      ...(c.tipo !== 'existente' ? [h2('1.2 Datos para el cálculo de cargas'),
        tabla(['Área', 'Orientación', 'Paredes al sol', 'Techos al sol', 'Vidrio', 'Techo', 'Horario'], cargas, ['*', 50, 38, 38, 62, 85, 62]), ...notasCargas] : []),

      h1('2. ' + t.antecedentes), parrafo(c.antecedentes),
      h1('3. Alcance'), parrafo(c.alcance),
      ...(c.exclusiones ? [{ text: [{ text: 'Exclusiones: ', bold: true }, c.exclusiones], margin: [0, 0, 0, 6] }] : []),
      h1('4. Metodología e instrumentación'), parrafo(c.metodologia),
      tabla(['Instrumento', 'Marca / modelo', 'N.º de serie', 'Variable medida'], (c.instrumentos || []).map((x) => [x.instrumento || '', x.marca_modelo || '', x.serie || '', x.variable || '']), ['*', '*', 90, '*']),

      h1('5. ' + t.descripcion),

        tabla(['TAG', 'Tipo', 'Marca / modelo', 'Capacidad', 'Refrigerante', 'Área servida', ...(mixto ? ['Destino'] : [])],
          (c.equipos || []).map((e) => [e.tag || '', TIPOS_EQUIPO[e.tipo] || '', e.marca_modelo || '', e.capacidad || '', REFRIGERANTES[e.refrigerante] || '', nombreArea(e.area_id), ...(mixto ? [DESTINOS[e.destino] || ''] : [])]),
          mixto ? [40, 58, '*', 55, 52, 70, 50] : [40, 65, '*', 65, 58, 80])] : []),
      h2((nueva ? '5.1' : '5.2') + ' Facilidades para la instalación'),
      claveValor([['Tablero disponible', el.tablero], ['Tensión y fases', el.tension], ['Capacidad disponible', el.capacidad], ['Observaciones eléctricas', el.observacion],
        ['Rutas para tuberías y ductos', fa.rutas], ['Ubicación posible de equipos', fa.ubicacion_equipos], ['Drenajes', fa.drenajes], ['Acceso a techo o estructura', fa.acceso_techo],
        ...(c.tipo !== 'existente' ? [['Estado de la obra', ESTADOS_OBRA[fa.estado_obra]], ['Coincidencia con planos del cliente', COINCIDE[fa.coincide_planos]]] : []),
        ['Otras observaciones', fa.observaciones]]),

      h1('6. ' + t.hallazgos),
      tabla(['N.º', t.hallazgo, 'Ubicación', t.severidad, 'Foto'], (c.hallazgos || []).map((h, j) => [`${pref}-${pad2(j + 1)}`, h.descripcion || '',
        [nombreArea(h.area_id), h.ubicacion].filter(Boolean).join(' · '), SEVERIDAD[h.severidad] || '', fotosDe('hallazgo', h.id)]), [34, '*', 85, 80, 45]),

      h1('9. Conclusiones'), parrafo(c.conclusiones),
      h1('10. Anexos'), h2('10.1 Registro fotográfico'),
      filasFoto.length ? { table: { widths: ['*', '*'], body: filasFoto }, layout: 'noBorders' } : sinDato(),
      h2('10.2 Registros de medición'), parrafo(c.mediciones),

      { text: 'Firmas', style: 'h2', margin: [0, 18, 0, 6], headlineLevel: 1 },
      { columns: [
        { stack: [{ text: 'Elaborado por:', bold: true }, { text: ' ', margin: [0, 28, 0, 0] }, { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 200, y2: 0, lineWidth: 0.6 }] },
          { text: L.meta?.responsable || estado.perfil.nombre, margin: [0, 3, 0, 0] }, { text: 'Responsable de la inspección', fontSize: 8, color: GRIS }] },
        { stack: [{ text: 'Revisado / Aprobado por:', bold: true }, { text: ' ', margin: [0, 28, 0, 0] }, { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 200, y2: 0, lineWidth: 0.6 }] },
          { text: aprobado ? L.meta?.aprobador || '' : ' ', margin: [0, 3, 0, 0] }, { text: 'Coordinación de Proyectos', fontSize: 8, color: GRIS }] }], unbreakable: true },

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;

// ----------------------------------------------------------------------------- latido de avisos
async function latido() {
  if (!estado.perfil?.rol || !navigator.onLine || estado.sinConexion) return;
  pendientesLocales().then((x) => { if (x.lev + x.fotos) programarSinc(100); });
  const { count, error } = await estado.sb.from('notificaciones').select('id', { count: 'exact', head: true }).is('leida_en', null);
  if (!error) { estado.noLeidos = count || 0; pintarContador(); }
}
function pintarContador() {
  const c = $('#contador'); if (!c) return;
  c.hidden = !estado.noLeidos; c.textContent = estado.noLeidos > 99 ? '99+' : String(estado.noLeidos);
  $('#b-campana')?.setAttribute('aria-label', estado.noLeidos ? `Avisos: ${estado.noLeidos} sin leer` : 'Avisos');
}
function iniciarLatido() { detenerLatido(); latido(); estado.latido = setInterval(latido, CONFIG.latidoMs); }
function detenerLatido() { if (estado.latido) clearInterval(estado.latido); estado.latido = null; }

// ----------------------------------------------------------------------------- versión nueva
// Un teléfono puede retomar la app desde memoria sin descargar lo publicado. Se compara la
// versión en uso con version.json del servidor al volver a la app y cada 5 minutos.
async function revisarVersion() {
  if (!navigator.onLine) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { version } = await r.json();
    const f = $('#franja-version');
    if (f && version && version !== APP_VERSION) f.hidden = false;
  } catch { /* sin conexión o sin archivo: no se avisa */ }
}
async function actualizarAhora() {
  const b = $('#b-actualizar'); if (b) { b.disabled = true; b.textContent = 'Actualizando…'; }
  try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch { /* se recarga igual */ }
  location.reload();
}
document.addEventListener('click', (ev) => { if (ev.target.closest('#b-actualizar')) actualizarAhora(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') revisarVersion(); });
setInterval(revisarVersion, 5 * 60 * 1000);

// ----------------------------------------------------------------------------- conexión y arranque
addEventListener('online', () => {
  $('#franja-red')?.setAttribute('hidden', '');
  if (estado.sinConexion) { iniciarSesion(); return; }   // se recupera la sesión y se sincroniza
  latido(); programarSinc(500);
});
addEventListener('offline', () => $('#franja-red')?.removeAttribute('hidden'));

estado.sb.auth.onAuthStateChange((evento) => {
  if (evento === 'PASSWORD_RECOVERY') { estado.definirClave = true; pantallaDefinirClave(); }
  if (evento === 'SIGNED_OUT' && estado.perfil) { estado.perfil = null; pantallaLogin('Su sesión terminó. Inicie sesión de nuevo.'); }
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

iniciarSesion().catch((e) => pantallaLogin(mensajeError(e)));
</script>
