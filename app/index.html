<meta name="mobile-web-app-capable" content="yes">

<style>
/* -----------------------------------------------------------------------------
   Tipografía: Source Sans 3 (sustituto libre de Myriad Pro, manual de marca 2016).
   Copiada en vendor/ para que funcione sin conexión.
   ----------------------------------------------------------------------------- */
@font-face { font-family: 'Source Sans 3'; font-weight: 400; font-display: swap; src: url(vendor/source-sans-3-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 600; font-display: swap; src: url(vendor/source-sans-3-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Source Sans 3'; font-weight: 700; font-display: swap; src: url(vendor/source-sans-3-latin-700-normal.woff2) format('woff2'); }

/* -----------------------------------------------------------------------------
   Colores. Marca según «RefriAmérica · Identidad Corporativa» (MEGAIDEA, 2016):
     281 C #00205C  ·  286 C #0033A1  ·  3005 C #0075C9  ·  361 C #3DAF2C  ·  282 C #011E41
   3005 C y 361 C NO alcanzan 4,5:1 sobre blanco: son de marca, no de texto.
   Los colores de estado (ok, alerta, error) son decisión de interfaz: el manual no los norma.
   ----------------------------------------------------------------------------- */
:root {
  --p281: #00205C; --p286: #0033A1; --p3005: #0075C9; --p361: #3DAF2C; --p282: #011E41;
  --fondo: #F3F5F9; --tarjeta: #FFFFFF; --linea: #D5DCE6; --linea2: #B8C2D1;
  --texto: #0E1B33; --texto2: #4A5468; --marca: var(--p281); --enlace: var(--p286);
  --primario: var(--p281); --primario-texto: #FFFFFF; --primario-hover: var(--p286);
  --suave: #E6EBF3;
  --ok: #1B6E35; --ok-fondo: #E3F3E6; --alerta: #7A4F00; --alerta-fondo: #FFF2D2;
  --error: #A8231A; --error-fondo: #FCE8E6; --info-fondo: #E5EEFA;
  --foco: #0075C9;
  --radio: 12px; --sombra: 0 1px 2px rgba(14,27,51,.06), 0 2px 8px rgba(14,27,51,.06);
  --barra-alto: 60px; --tabs-alto: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #011E41; --tarjeta: #0A2B55; --linea: #22436E; --linea2: #335A8A;
    --texto: #EEF3FA; --texto2: #A9BAD3; --marca: #EEF3FA; --enlace: #7CC4F2;
    --primario: #00A1E0; --primario-texto: #011E41; --primario-hover: #3AB8EA;
    --suave: #0F3463;
    --ok: #7FD69A; --ok-fondo: #0F3A28; --alerta: #FFD27A; --alerta-fondo: #3D2E07;
    --error: #FF9C93; --error-fondo: #4A1712; --info-fondo: #0F3463;
    --foco: #00A1E0;
    --sombra: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-size: 16px; line-height: 1.45; color: var(--texto); background: var(--fondo);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; color: var(--marca); }
h1 { font-size: 1.5rem; font-weight: 700; } h2 { font-size: 1.2rem; font-weight: 700; } h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0 0 .75rem; }
a { color: var(--enlace); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
[hidden] { display: none !important; }
.oculto-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Logotipo: siempre como imagen, con su proporción original (height fija, width auto).
   En modo oscuro va sobre una placa blanca para no alterar sus colores. */
.logo { display: block; height: auto; max-width: 100%; }
.placa-logo { background: #FFFFFF; border-radius: 10px; padding: 6px 10px; display: inline-flex; }

/* Controles */
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.campo label { font-weight: 600; font-size: .95rem; }
.campo .ayuda { font-size: .85rem; color: var(--texto2); }
input, select, textarea {
  min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--linea2); border-radius: 10px;
  background: var(--tarjeta); width: 100%;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--foco); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--foco) 30%, transparent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1.5px solid transparent;
  font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn-primario { background: var(--primario); color: var(--primario-texto); }
.btn-primario:hover { background: var(--primario-hover); }
.btn-secundario { background: transparent; border-color: var(--linea2); color: var(--texto); }
.btn-secundario:hover { background: var(--suave); }
.btn-peligro { background: transparent; border-color: var(--error); color: var(--error); }
.btn-texto { background: none; border: none; color: var(--enlace); padding: 0 6px; min-height: 44px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-bloque { width: 100%; }
.icono { width: 22px; height: 22px; flex: none; }

/* Avisos en pantalla */
.aviso { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; border-left: 5px solid; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.aviso-error { background: var(--error-fondo); border-color: var(--error); color: var(--error); }
.aviso-ok { background: var(--ok-fondo); border-color: var(--ok); color: var(--ok); }
.aviso-info { background: var(--info-fondo); border-color: var(--enlace); }
.aviso-alerta { background: var(--alerta-fondo); border-color: var(--alerta); color: var(--alerta); }

/* Pantallas de acceso */
.acceso { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.acceso .tarjeta { width: 100%; max-width: 420px; padding: 28px 24px; }
.acceso .encabezado { text-align: center; margin-bottom: 22px; }
.acceso .encabezado .placa-logo { padding: 10px 16px; margin-bottom: 14px; }
.acceso .encabezado img { height: 96px; width: auto; }
.acceso .pie { text-align: center; color: var(--texto2); font-size: .85rem; margin-top: 18px; }

.tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: var(--radio); box-shadow: var(--sombra); padding: 18px; }

/* Estructura de la aplicación */
.franja-modo { background: var(--alerta-fondo); color: var(--alerta); text-align: center; font-weight: 600; font-size: .85rem; padding: 4px 8px; }
/* Levantamientos */
.estado-sinc { font-size: .88rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; margin: 8px 0 12px; }
.estado-sinc:empty { display: none; }
.estado-sinc.ok { background: var(--ok-fondo); color: var(--ok); }
.estado-sinc.pendiente, .estado-sinc.subiendo { background: var(--alerta-fondo); color: var(--alerta); }
.estado-sinc.error { background: var(--error-fondo); color: var(--error); }
.pasos { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin: 6px 0 8px; scrollbar-width: thin; }
.pasos button { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--linea); background: var(--tarjeta); color: var(--texto2);
  border-radius: 999px; padding: 6px 12px 6px 6px; font: inherit; font-size: .88rem; cursor: pointer; min-height: 40px; }
.pasos button .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--fondo); font-weight: 700; }
.pasos button[aria-current="step"] { border-color: var(--marca); color: var(--marca); font-weight: 600; }
.pasos button[aria-current="step"] .n { background: var(--marca); color: var(--tarjeta); }
@media (max-width: 639px) { .pasos button:not([aria-current]) .t { display: none; } .pasos button:not([aria-current]) { padding-right: 6px; } }
.paso-lev { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 12px; padding: 16px; }
.paso-lev h2 { margin-top: 0; }
.paso-lev h3 { margin: 18px 0 8px; }
fieldset.sin-borde { border: 0; padding: 0; margin: 0; min-width: 0; }
.nav-pasos { display: flex; justify-content: space-between; gap: 10px; margin: 14px 0 24px; }
.opciones-tipo { display: grid; gap: 8px; }
@media (min-width: 640px) { .opciones-tipo { grid-template-columns: repeat(3, 1fr); } }
.opcion-tipo { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--linea); border-radius: 10px; padding: 10px; cursor: pointer; font-weight: 400; }
.opcion-tipo:has(input:checked) { border-color: var(--marca); background: var(--fondo); }
.opcion-tipo input { margin-top: 3px; width: 20px; height: 20px; flex: 0 0 auto; }
.item-lista { border: 1px solid var(--linea); border-radius: 10px; margin: 0 0 10px; background: var(--tarjeta); }
.item-lista > summary { display: flex; gap: 10px; align-items: center; padding: 12px; cursor: pointer; font-weight: 600; min-height: 48px; list-style: none; }
.item-lista > summary::-webkit-details-marker { display: none; }
.item-lista > summary::after { content: '▾'; margin-left: auto; color: var(--texto2); }
.item-lista[open] > summary::after { content: '▴'; }
.item-lista > summary > span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n-item { background: var(--fondo); color: var(--marca); border-radius: 6px; padding: 2px 8px; font-size: .85rem; font-weight: 700; }
.cuerpo-item { padding: 0 12px 12px; border-top: 1px solid var(--linea); }
.grupo-cargas { margin-top: 10px; }
.valor-calc { min-height: 44px; display: flex; align-items: center; font-weight: 700; color: var(--marca); }
.btn-texto.peligro { color: var(--error); }
.bloque-fotos { margin: 12px 0 4px; }
.titulo-fotos { font-weight: 600; margin-bottom: 6px; }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.foto { margin: 0; border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; background: var(--fondo); }
.foto img, .foto .sin-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.foto .sin-img { display: grid; place-items: center; color: var(--texto2); font-size: .85rem; }
.foto figcaption { padding: 6px; display: grid; gap: 4px; }
.foto figcaption input { min-height: 38px; font-size: .9rem; }
.nfoto { font-weight: 700; font-size: .85rem; color: var(--marca); }
.botones-foto { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.botones-foto .btn { cursor: pointer; }
.chequeo { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.chequeo li { padding: 8px 10px; border-radius: 8px; background: var(--fondo); }
.chequeo li.ok { color: var(--ok); } .chequeo li.falta { color: var(--error); background: var(--error-fondo); } .chequeo li.aviso { color: var(--alerta); }
.botones-revision { display: flex; gap: 10px; flex-wrap: wrap; }
.franja-version { background: var(--marca); color: #fff; text-align: center; font-weight: 600; font-size: .9rem; padding: 6px 8px; }
.franja-version .btn-texto { color: #fff; text-decoration: underline; font-weight: 700; margin-left: 6px; padding: 0; min-height: 0; }
.franja-red { background: var(--error-fondo); color: var(--error); text-align: center; font-weight: 600; font-size: .85rem; padding: 4px 8px; }
.barra {
  position: sticky; top: 0; z-index: 20; height: var(--barra-alto);
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  padding-top: env(safe-area-inset-top);
  background: var(--tarjeta); border-bottom: 1px solid var(--linea);
}
.barra .placa-logo { padding: 4px 8px; }
.barra .placa-logo img { height: 34px; width: auto; }
.barra .titulo { font-weight: 700; color: var(--marca); font-size: 1.05rem; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-icono { position: relative; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; border: none; background: transparent; cursor: pointer; color: var(--texto); }
.btn-icono:hover { background: var(--suave); }
.contador { position: absolute; top: 6px; right: 6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--error); color: #fff; font-size: .75rem; font-weight: 700; display: grid; place-items: center; }

.cuerpo { display: flex; }
.lateral { display: none; }
.principal { flex: 1; min-width: 0; padding: 18px 16px calc(var(--tabs-alto) + 24px + env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
.pestanas {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex;
  background: var(--tarjeta); border-top: 1px solid var(--linea);
  padding-bottom: env(safe-area-inset-bottom); height: calc(var(--tabs-alto) + env(safe-area-inset-bottom));
}
.pestanas a, .lateral a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--texto2); font-size: .78rem; font-weight: 600; min-height: 48px;
}
.pestanas a[aria-current="page"], .lateral a[aria-current="page"] { color: var(--enlace); }
.pestanas a[aria-current="page"] .icono { stroke-width: 2.4; }

@media (min-width: 900px) {
  .pestanas { display: none; }
  .lateral {
    display: flex; flex-direction: column; gap: 4px; width: 232px; flex: none; padding: 16px 12px;
    position: sticky; top: var(--barra-alto); height: calc(100dvh - var(--barra-alto)); border-right: 1px solid var(--linea); background: var(--tarjeta);
  }
  .lateral a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; border-radius: 10px; font-size: .98rem; }
  .lateral a:hover { background: var(--suave); }
  .lateral a[aria-current="page"] { background: var(--suave); color: var(--marca); }
  .principal { padding: 28px 32px 40px; }
}

/* Contenido */
.cabecera-modulo { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.cabecera-modulo p { color: var(--texto2); margin: 0; }
.rejilla { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .rejilla { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .rejilla.tres { grid-template-columns: repeat(3, 1fr); } }
.modulo-proximo h3 { display: flex; align-items: center; gap: 8px; }
.modulo-proximo p { color: var(--texto2); margin: 0; font-size: .95rem; }
.distintivo { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: .78rem; font-weight: 700; background: var(--suave); color: var(--marca); white-space: nowrap; }
.distintivo.ok { background: var(--ok-fondo); color: var(--ok); }
.distintivo.apagado { background: var(--fondo); color: var(--texto2); border: 1px solid var(--linea); }
.distintivo.alerta { background: var(--alerta-fondo); color: var(--alerta); }

.lista { list-style: none; margin: 0; padding: 0; }
.lista > li { border-bottom: 1px solid var(--linea); padding: 14px 4px; display: flex; gap: 12px; align-items: flex-start; }
.lista > li:last-child { border-bottom: none; }
.lista .principal-fila { flex: 1; min-width: 0; }
.lista .nombre { font-weight: 600; }
.lista .detalle { color: var(--texto2); font-size: .92rem; overflow-wrap: anywhere; }
.lista .acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.aviso-item.no-leido .nombre::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--p3005); margin-right: 8px; vertical-align: middle; }
.vacio { text-align: center; color: var(--texto2); padding: 28px 8px; }

.filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.filtros input { flex: 1 1 220px; }
.filtros select { flex: 0 1 220px; }

dl.datos { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
dl.datos dt { color: var(--texto2); }
dl.datos dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

/* Ventana de formulario */
dialog { border: none; border-radius: 16px; padding: 0; overflow-y: auto; overscroll-behavior: contain; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--tarjeta); color: var(--texto); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(1, 30, 65, .55); }
dialog form { padding: 22px 20px 18px; }
dialog .botones { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
.dos-columnas { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .dos-columnas { grid-template-columns: 1fr 1fr; } }

.cargando { display: grid; place-items: center; min-height: 100dvh; color: var(--texto2); }
.giro { width: 32px; height: 32px; border: 3px solid var(--linea); border-top-color: var(--p3005); border-radius: 50%; animation: giro 0.9s linear infinite; margin: 0 auto 12px; }
@keyframes giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .giro { animation: none; } }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-alto) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; max-width: calc(100vw - 32px); }
@media (min-width: 900px) { .toast { bottom: 24px; } }
.version { color: var(--texto2); font-size: .82rem; }
.distintivo.error { background: var(--error-fondo); color: var(--error); }
.distintivo.info { background: var(--info-fondo); color: var(--enlace); }
.codigo { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--marca); letter-spacing: .01em; }
fieldset { border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px 4px; margin: 0 0 16px; background: var(--tarjeta); }
legend { font-weight: 700; color: var(--marca); padding: 0 6px; }
.casillas { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; margin-bottom: 14px; }
.casillas label { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 400; cursor: pointer; }
.casillas input { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--p286); }
.tres-columnas { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .tres-columnas { grid-template-columns: repeat(3, 1fr); } }
.fila-req { cursor: pointer; }
.fila-req:hover { background: var(--suave); }
.historial { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--linea); }
.historial li { position: relative; padding: 0 0 14px 12px; }
.historial li::before { content: ''; position: absolute; left: -21px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--p3005); }
.contadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.contadores .tarjeta { padding: 12px 14px; cursor: pointer; }
.contadores .cifra { font-size: 1.7rem; font-weight: 700; color: var(--marca); line-height: 1.1; }
.contadores .etiqueta { color: var(--texto2); font-size: .9rem; }
</style>
</head>
<body>
<div id="raiz"><div class="cargando"><div><div class="giro"></div>Cargando…</div></div></div>

<!-- Iconos (trazos, heredan el color del texto) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inicio" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-avisos" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-personal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M16 3.5a4 4 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.6"/></symbol>

<script src="vendor/supabase.js"></script>
<script>
'use strict';
// =============================================================================
// SGP · Sistema de Gestión de Proyectos · Grupo RefriAmerica
// Aplicación de un solo archivo. Toda la lógica de permisos vive en la base (RLS y
// funciones rpc_*): lo que aquí se oculta es cortesía, no seguridad.
// =============================================================================
const APP_VERSION = '0.4.0';   // subir junto con sw.js (VERSION) y version.json

// Configuración pública. La clave publicable PUEDE estar aquí: los datos los protegen
// las reglas de la base. La clave secreta NUNCA va en la aplicación.
const CONFIG = {
  supabaseUrl: 'https://lwhczkzhsnqawettzzfw.supabase.co',
  supabaseKey: 'sb_publishable_VLKiZ4kToyptxjQUgNqbCw_SJ2ryv-_',
  latidoMs: 30000,
};

const ROLES = {
  admin: 'Administrador', gerente: 'Gerente de Ingeniería', coordinador: 'Coordinador de Proyectos',
  ingeniero: 'Ingeniero', control_gestion: 'Control de Gestión', ventas: 'Ventas', construccion: 'Construcción',
};
const DISCIPLINAS = { HV: 'HVAC mecánico', AU: 'Automatización y controles', GE: 'General' };
const CONDUCE = ['admin', 'gerente', 'coordinador'];
const VE_TODO = [...CONDUCE, 'control_gestion'];
const VE_REQ = [...VE_TODO, 'ingeniero', 'ventas'];          // ven el módulo (la base filtra qué filas)
const VE_CLIENTES = [...VE_TODO, 'ventas'];
const REGISTRA_REQ = [...CONDUCE, 'ventas'];

// Módulos que llegan en las próximas sesiones (Plan de arranque, sección 6)
const PROXIMOS = [
  { nombre: 'Control documental', proceso: 'PRY-03 · 07 · 10', sesion: 4, texto: 'Documentos codificados, revisiones, aprobación y firma con número CIV.' },
  { nombre: 'Equipos', proceso: 'PRY-07 · 08 · 10', sesion: 5, texto: 'Ficha única de equipo, compatible con el sistema de Servicios.' },
  { nombre: 'Horas e indicadores', proceso: 'Todos', sesion: 6, texto: 'Horas por proyecto, modalidad y disciplina; tablero de indicadores.' },
];

// ----------------------------------------------------------------------------- utilidades
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icono = (id) => `<svg class="icono" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const fmtFechaHora = (iso) => iso ? new Intl.DateTimeFormat('es-VE', { timeZone: 'America/Caracas', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)) : '';

// Mensajes en castellano llano, nunca un código de error
function mensajeError(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || '');
  if (/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Su cuenta aún no está confirmada. Avise a la Coordinación de Proyectos.';
  if (/Failed to fetch|NetworkError|Load failed|fetch/i.test(m)) return 'No hay conexión con el servidor. Revise su conexión e intente de nuevo.';
  if (/rate limit|too many/i.test(m)) return 'Demasiados intentos seguidos. Espere unos minutos e intente de nuevo.';
  if (/Password should be at least/i.test(m)) return 'La contraseña debe tener al menos 8 caracteres.';
  if (/same password|different from the old/i.test(m)) return 'La contraseña nueva debe ser distinta de la anterior.';
  if (/JWT expired|invalid JWT|session/i.test(m)) return 'Su sesión venció. Inicie sesión de nuevo.';
  if (/permission denied|violates row-level security/i.test(m)) return 'No tiene permiso para esta acción.';
  return m || 'Ocurrió un error inesperado.';
}

function toast(texto, tipo = 'ok') {
  const t = document.createElement('div');
  t.className = `toast aviso aviso-${tipo}`; t.setAttribute('role', 'status'); t.textContent = texto;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3800);
}

// ----------------------------------------------------------------------------- estado
// El enlace de invitación o de recuperación trae el tipo en la dirección. Se lee ANTES de
// crear el cliente, que la limpia al procesarla.
const enlace = new URLSearchParams(location.hash.replace(/^#/, '') + '&' + location.search.replace(/^\?/, ''));
const estado = {
  sb: null, sesion: null, perfil: null, ruta: 'inicio',
  definirClave: ['invite', 'recovery'].includes(enlace.get('type')),
  latido: null, noLeidos: 0, personal: [], param: null, clientes: [], reqs: [],
};

if (!window.supabase || !window.supabase.createClient) {
  document.getElementById('raiz').innerHTML = '<div class="acceso"><div class="tarjeta aviso aviso-error">No se pudo cargar la aplicación. Recargue la página.</div></div>';
  throw new Error('supabase-js no cargó');
}
estado.sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

// ----------------------------------------------------------------------------- pantallas de acceso
function encabezadoAcceso(subtitulo) {
  return `<div class="encabezado">
    <span class="placa-logo"><img class="logo" src="assets/logo-centrado.png" alt="Grupo RefriAmerica" width="720" height="385"></span>
    <h1>Sistema de Gestión de Proyectos</h1>
    <p style="color:var(--texto2);margin:0">${esc(subtitulo)}</p>
  </div>`;
}

function pantallaLogin(mensaje) {
  detenerLatido();
  $('#raiz').innerHTML = `<main class="acceso"><div class="tarjeta">
    ${encabezadoAcceso('Departamento de Proyectos')}
    <div id="msj">${mensaje ? `<div class="aviso aviso-info">${esc(mensaje)}</div>` : ''}</div>
    <form id="f-login" novalidate>
      <div class="campo"><label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="username" inputmode="email" required autocapitalize="none"></div>
      <div class="campo"><label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primario btn-bloque" type="submit">Entrar</button>
    </form>
    <p style="text-align:center;margin:14px 0 0"><button class="btn-texto" id="b-olvido" type="button">¿Olvidó su contraseña?</button></p>
    <p class="pie">Grupo RefriAmerica · v${APP_VERSION}</p>
  </div></main>`;
  $('#f-login').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const correo = $('#correo').value.trim(), clave = $('#clave').value;
    if (!correo || !clave) return mostrarError('Escriba su correo y su contraseña.');
    const b = ev.submitter || $('#f-login button'); b.disabled = true; b.textContent = 'Entrando…';
    try {
      const { error } = await estado.sb.auth.signInWithPassword({ email: correo, password: clave });
      if (error) throw error;
      await iniciarSesion();
    } catch (e) { mostrarError(mensajeError(e)); b.disabled = false; b.textContent = 'Entrar'; }
  });
  $('#b-olvido').addEventListener('click', pantallaRecuperar);
  setTimeout(() => $('#correo')?.focus(), 50);
}

function mostrarError(texto) {
  const m = $('#msj'); if (m) m.innerHTML = `<div class="aviso aviso-error" role="alert">${esc(texto)}</div>`;
}

function pantallaRecuperar() {
  $('#raiz').innerHTML = `<main class="acceso"><div class="tarjeta">
    ${encabezadoAcceso('Recuperar la contraseña')}
    <div id="msj"></div>
    <p>Escriba el correo de su cuenta. Le enviaremos un enlace para definir una contraseña nueva.</p>
    <form id="f-rec" novalidate>
      <div class="campo"><label for="correo">Correo</label>
        <input id="correo" type="email" autocomplete="username" inputmode="email" required autocapitalize="none"></div>
      <button class="btn btn-primario btn-bloque" type="submit">Enviar enlace</button>
    </form>
    <p style="text-align:center;margin:14px 0 0"><button class="btn-texto" id="b-volver" type="button">Volver a iniciar sesión</button></p>
  </div></main>`;
  $('#b-volver').addEventListener('click', () => pantallaLogin());
  $('#f-rec').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const correo = $('#correo').value.trim();
    if (!correo) return mostrarError('Escriba su correo.');
    const b = $('#f-rec button'); b.disabled = true;
    try {
      const { error } = await estado.sb.auth.resetPasswordForEmail(correo, { redirectTo: location.origin + location.pathname });
      if (error) throw error;
      // Mismo mensaje exista o no la cuenta: no se revela qué correos están registrados.
      $('#msj').innerHTML = '<div class="aviso aviso-ok" role="status">Si el correo tiene una cuenta, recibirá un enlace en unos minutos. Revise también la carpeta de correo no deseado.</div>';
    } catch (e) { mostrarError(mensajeError(e)); }
    b.disabled = false;
  });
}

function pantallaDefinirClave() {
  $('#raiz').innerHTML = `<main class="acceso"><div class="tarjeta">
    ${encabezadoAcceso('Defina su contraseña')}
    <div id="msj"></div>
    <form id="f-clave" novalidate>
      <div class="campo"><label for="c1">Contraseña nueva</label>
        <input id="c1" type="password" autocomplete="new-password" minlength="8" required>
        <span class="ayuda">Al menos 8 caracteres.</span></div>
      <div class="campo"><label for="c2">Repita la contraseña</label>
        <input id="c2" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn btn-primario btn-bloque" type="submit">Guardar contraseña</button>
    </form>
  </div></main>`;
  $('#f-clave').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const c1 = $('#c1').value, c2 = $('#c2').value;
    if (c1.length < 8) return mostrarError('La contraseña debe tener al menos 8 caracteres.');
    if (c1 !== c2) return mostrarError('Las dos contraseñas no coinciden.');
    try {
      const { error } = await estado.sb.auth.updateUser({ password: c1 });
      if (error) throw error;
      estado.definirClave = false;
      history.replaceState(null, '', location.pathname);
      toast('Contraseña guardada.');
      await iniciarSesion();
    } catch (e) { mostrarError(mensajeError(e)); }
  });
}

// ----------------------------------------------------------------------------- sesión
async function iniciarSesion() {
  const { data, error } = await estado.sb.auth.getSession();
  estado.sinConexion = false;
  let sesion = data?.session;
  if (!sesion) {
    // Sin señal y con la sesión vencida: se trabaja con lo guardado en el teléfono
    const guardado = perfilLocal();
    if (guardado && esErrorDeRed(error) && localStorage.getItem(`sb-${new URL(CONFIG.supabaseUrl).hostname.split('.')[0]}-auth-token`)) {
      sesion = { user: { id: guardado.uid } }; estado.sinConexion = true;
    } else return pantallaLogin();
  }
  estado.sesion = sesion;
  if (estado.definirClave) return pantallaDefinirClave();
  if (estado.sinConexion) estado.perfil = perfilLocal(sesion.user.id).perfil;
  else {
    const r = await estado.sb.rpc('rpc_mi_sesion');
    if (r.error) {
      const guardado = perfilLocal(sesion.user.id);
      if (esErrorDeRed(r.error) && guardado) { estado.perfil = guardado.perfil; estado.sinConexion = true; }
      else { await estado.sb.auth.signOut(); return pantallaLogin(mensajeError(r.error)); }
    } else { estado.perfil = r.data; guardarPerfilLocal(sesion.user.id, r.data); }
  }
  await asegurarDueno(sesion.user.id);
  const [ruta, param] = location.hash.replace(/^#\/?/, '').split('/');
  estado.ruta = rutasPermitidas().some((x) => x.id === ruta) ? ruta : 'inicio';
  estado.param = estado.ruta === ruta ? (param || null) : null;
  pintarAplicacion();
  iniciarLatido(); revisarVersion();
  if (estado.sinConexion) toast('Sin señal: trabaja con lo guardado en este equipo. Se sincroniza al recuperar la conexión.', 'info');
  else programarSinc(1500);
}

async function cerrarSesion() {
  const p = await pendientesLocales();
  if (p.lev + p.fotos && !estado.confirmaSalir) {
    abrirDialogo({ titulo: 'Hay datos sin subir', textoAceptar: 'Cerrar sesión de todos modos', peligro: true,
      html: `<p>En este equipo hay ${p.lev} levantamiento(s) y ${p.fotos} foto(s) que todavía no llegan al servidor. Si cierra la sesión <strong>se pierden</strong>.</p>
             <p>Recomendado: cancele, busque señal y espere a ver «Todo guardado en el servidor».</p>`,
      alAceptar: () => { estado.confirmaSalir = true; cerrarSesion(); return true; } });
    return;
  }
  estado.confirmaSalir = false;
  try { await BD.vaciar(); localStorage.removeItem(PERFIL_LOCAL); } catch { /* */ }
  detenerLatido();
  await estado.sb.auth.signOut();
  estado.perfil = null; estado.sesion = null;
  history.replaceState(null, '', location.pathname);
  pantallaLogin('Sesión cerrada.');
}

const tieneRol = (lista) => !!estado.perfil && lista.includes(estado.perfil.rol);

function rutasPermitidas() {
  const r = [{ id: 'inicio', nombre: 'Inicio', icono: 'inicio' }];
  if (tieneRol(VE_REQ)) r.push({ id: 'requerimientos', nombre: 'Requerimientos', corto: 'Requerim.', icono: 'requerimientos' });
  // En el teléfono, Levantamientos ocupa pestaña solo si caben (máximo 5): quien ve Personal lo abre desde el menú o la ficha
  if (tieneRol(VE_REQ)) r.push({ id: 'levantamientos', nombre: 'Levantamientos', corto: 'Levantam.', icono: 'levantamientos', soloLateral: tieneRol(VE_TODO) });
  if (tieneRol(VE_CLIENTES)) r.push({ id: 'clientes', nombre: 'Clientes', icono: 'clientes', soloLateral: true });
  if (estado.perfil?.rol) r.push({ id: 'avisos', nombre: 'Avisos', icono: 'avisos' });
  if (tieneRol(VE_TODO)) r.push({ id: 'personal', nombre: 'Personal', icono: 'personal' });
  r.push({ id: 'cuenta', nombre: 'Mi cuenta', icono: 'cuenta' });
  return r;
}

// ----------------------------------------------------------------------------- estructura
function pintarAplicacion() {
  const rutas = rutasPermitidas();
  const nav = (clase) => rutas.filter((x) => clase === 'lateral' || !x.soloLateral).map((x) => `<a href="#/${x.id}" data-ruta="${x.id}" aria-label="${x.nombre}" ${x.id === estado.ruta ? 'aria-current="page"' : ''}>${icono(x.icono)}<span>${clase === 'lateral' ? x.nombre : x.corto || x.nombre}</span></a>`).join('');
  $('#raiz').innerHTML = `
    ${estado.perfil.modo === 'prueba' ? '<div class="franja-modo" role="note">MODO PRUEBA · los datos registrados son de práctica</div>' : ''}
    <div class="franja-red" id="franja-red" role="status" ${navigator.onLine ? 'hidden' : ''}>Sin conexión · lo que vea puede no estar actualizado</div>
    <div class="franja-version" id="franja-version" role="status" hidden>Hay una versión nueva del sistema.
      <button class="btn-texto" id="b-actualizar" type="button">Actualizar ahora</button></div>
    <header class="barra">
      <span class="placa-logo"><img class="logo" src="assets/logo-horizontal.png" alt="Grupo RefriAmerica" width="640" height="191"></span>
      <span class="titulo">Proyectos</span>
      ${estado.perfil.rol ? `<button class="btn-icono" id="b-campana" type="button" aria-label="Avisos">${icono('avisos')}<span class="contador" id="contador" hidden>0</span></button>` : ''}
    </header>
    <div class="cuerpo">
      <nav class="lateral" aria-label="Menú principal">${nav('lateral')}</nav>
      <main class="principal" id="principal" tabindex="-1"></main>
    </div>
    <nav class="pestanas" aria-label="Menú principal">${nav('pestanas')}</nav>`;
  document.querySelectorAll('[data-ruta]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); ir(a.dataset.ruta); }));
  $('#b-campana')?.addEventListener('click', () => ir('avisos'));
  pintarContador();
  pintarRuta();
}

function ir(ruta, param = null) {
  if (!rutasPermitidas().some((x) => x.id === ruta)) { ruta = 'inicio'; param = null; }
  estado.ruta = ruta; estado.param = param;
  history.replaceState(null, '', '#/' + ruta + (param ? '/' + param : ''));
  document.querySelectorAll('[data-ruta]').forEach((a) => {
    if (a.dataset.ruta === ruta) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  pintarRuta();
}

function pintarRuta() {
  const p = $('#principal'); if (!p) return;
  const vistas = { inicio: vistaInicio, avisos: vistaAvisos, personal: vistaPersonal, cuenta: vistaCuenta,
                   clientes: vistaClientes, requerimientos: vistaRequerimientos, levantamientos: vistaLevantamientos };
  (vistas[estado.ruta] || vistaInicio)(p);
  p.focus({ preventScroll: true }); window.scrollTo(0, 0);
}

// ----------------------------------------------------------------------------- Inicio
function vistaInicio(p) {
  const pf = estado.perfil;
  const primerNombre = (pf.nombre || '').split(' ')[0];
  if (!pf.rol) {
    p.innerHTML = `<h1>Hola, ${esc(primerNombre)}</h1>
      <div class="aviso aviso-alerta" role="note"><strong>Su cuenta está creada, pero todavía no tiene un rol asignado.</strong><br>
      La Coordinación de Proyectos debe asignárselo para que pueda usar el sistema.</div>`;
    return;
  }
  p.innerHTML = `
    <div class="cabecera-modulo"><div><h1>Hola, ${esc(primerNombre)}</h1>
      <p>${esc(ROLES[pf.rol] || pf.rol)}${pf.cargo && pf.cargo !== ROLES[pf.rol] ? ' · ' + esc(pf.cargo) : ''}</p></div></div>
    <div id="resumen-req"></div>
    <div id="resumen-lev"></div>
    <h2 style="margin-top:18px">Módulos en preparación</h2>
    <div class="rejilla tres">
      ${PROXIMOS.map((m) => `<section class="tarjeta modulo-proximo" aria-label="${esc(m.nombre)}">
        <h3>${esc(m.nombre)} <span class="distintivo apagado">${icono('reloj').replace('class="icono"', 'class="icono" style="width:14px;height:14px;margin-right:4px"')}Sesión ${m.sesion}</span></h3>
        <p><strong>${esc(m.proceso)}</strong> · ${esc(m.texto)}</p></section>`).join('')}
    </div>`;
  if (tieneRol(VE_REQ)) { resumenRequerimientos($('#resumen-req')); resumenLevantamientos($('#resumen-lev')); }
}

// ----------------------------------------------------------------------------- Avisos
async function vistaAvisos(p) {
  p.innerHTML = `<div class="cabecera-modulo"><div><h1>Avisos</h1><p>Se actualizan cada 30 segundos.</p></div></div>
    <div class="tarjeta"><ul class="lista" id="l-avisos"><li class="vacio">Cargando…</li></ul></div>`;
  const { data, error } = await estado.sb.from('notificaciones').select('id,tipo,titulo,cuerpo,enlace,leida_en,creado_en').order('creado_en', { ascending: false }).limit(100);
  const ul = $('#l-avisos'); if (!ul) return;
  if (error) { ul.innerHTML = `<li class="vacio">${esc(mensajeError(error))}</li>`; return; }
  if (!data.length) { ul.innerHTML = '<li class="vacio">No tiene avisos.</li>'; return; }
  ul.innerHTML = data.map((n) => `<li class="aviso-item ${n.leida_en ? '' : 'no-leido'}">
      <div class="principal-fila"><div class="nombre">${esc(n.titulo)}</div>
        ${n.cuerpo ? `<div class="detalle">${esc(n.cuerpo)}</div>` : ''}
        <div class="detalle">${esc(fmtFechaHora(n.creado_en))}</div></div>
      <div class="acciones">
        ${n.enlace ? `<button class="btn btn-secundario" data-abrir="${esc(n.enlace)}" data-id="${n.id}" data-leido="${n.leida_en ? 1 : 0}" type="button">Abrir</button>` : ''}

function pintarListaPersonal() {

function siguientesEstados(r) {
  const yo = estado.perfil.perfil_id, conduce = tieneRol(CONDUCE);
  const t = { asignado: ['en_levantamiento', 'en_ingenieria'], en_levantamiento: ['en_ingenieria'], en_ingenieria: ['enviado_ventas'],
    enviado_ventas: ['aprobado', 'en_espera', 'rechazado'], en_espera: ['enviado_ventas', 'aprobado', 'rechazado'],
    aprobado: ['cerrado'], rechazado: ['cerrado'] };
  const lista = [...(t[r.estado] || [])];
  if (r.modalidad === 'A' && ['asignado', 'en_levantamiento', 'en_ingenieria'].includes(r.estado)) lista.push('cerrado');
  return lista.filter((n) => {
    if (conduce) return true;
    if (['en_levantamiento', 'en_ingenieria', 'enviado_ventas'].includes(n) || (n === 'cerrado' && r.modalidad === 'A')) return r.ingeniero_id === yo;
    if (['aprobado', 'en_espera', 'rechazado'].includes(n)) return r.vendedor_id === yo;
    return false;
  });
}

function pintarListaReq() {
  const ul = $('#l-req'); if (!ul) return;
  const q = ($('#f-buscar')?.value || '').trim().toLowerCase();
  const pasa = (GRUPOS_FILTRO[$('#f-grupo')?.value] || GRUPOS_FILTRO.abiertos)[1];
  const lista = estado.reqs.filter((r) => pasa(r.estado) &&
    (!q || [r.codigo, r.obra_nombre, r.cliente?.razon_social, r.ciudad].some((v) => (v || '').toLowerCase().includes(q))));
  if (!lista.length) { ul.innerHTML = `<li class="vacio">${estado.reqs.length ? 'No hay requerimientos que coincidan.' : 'Todavía no hay requerimientos.'}</li>`; return; }
  ul.innerHTML = lista.map((r) => `<li class="fila-req" data-id="${r.id}" tabindex="0" role="link" aria-label="${esc(r.codigo)} ${esc(r.obra_nombre)}">
      <div class="principal-fila">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="codigo">${esc(r.codigo)}</span>${distEstado(r.estado)}
          ${r.prioridad !== 'normal' ? `<span class="distintivo ${r.prioridad === 'urgente' ? 'error' : 'alerta'}">${esc(PRIORIDADES[r.prioridad])}</span>` : ''}
          ${r.modalidad ? `<span class="distintivo apagado">Modalidad ${esc(r.modalidad)}</span>` : ''}</div>
        <div class="nombre" style="margin-top:4px">${esc(r.obra_nombre)}</div>
        <div class="detalle">${esc(r.cliente?.razon_social || '')} · ${esc(r.ciudad)}, ${esc(r.estado_geo)}</div>
        <div class="detalle">${r.ingeniero ? 'Responsable: ' + esc(r.ingeniero.nombre) : 'Sin asignar'} · registrado ${esc(fmtFechaHora(r.registrado_en))}
          ${r.fecha_compromiso ? ' · entrega ' + esc(fmtFecha(r.fecha_compromiso)) : ''}</div>
      </div></li>`).join('');
  ul.querySelectorAll('[data-id]').forEach((li) => {
    li.addEventListener('click', () => ir('requerimientos', li.dataset.id));
    li.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') ir('requerimientos', li.dataset.id); });
  });
}

        </div></fieldset>
      <fieldset><legend>Obra / sitio</legend>
        <div class="campo"><label for="r-obra">Nombre de la obra *</label><input id="r-obra"></div>
        <div class="campo"><label for="r-dir">Dirección *</label><input id="r-dir"></div>
        <div class="dos-columnas">
          <div class="campo"><label for="r-edo">Estado *</label><select id="r-edo"><option value="">—</option>${ESTADOS_VE.map((e) => `<option>${esc(e)}</option>`).join('')}</select></div>
          <div class="campo"><label for="r-ciudad">Ciudad *</label><input id="r-ciudad"></div>
        </div>
        <div class="tres-columnas">
          <div class="campo"><label for="r-edif">Tipo de edificación</label><select id="r-edif">${opciones(EDIFICACIONES, '', '—')}</select></div>
          <div class="campo"><label for="r-area">Área aproximada (m²)</label><input id="r-area" inputmode="decimal"></div>

  const cargarClientes = async (elegir) => {
    const { data } = await estado.sb.from('clientes').select('id,codigo,razon_social,rif,contacto_nombre,contacto_cargo,contacto_telefono,contacto_correo').eq('activo', true).order('razon_social');
    estado.clientes = data || [];
    if (!$('#r-cliente')) return;
    $('#r-cliente').innerHTML = '<option value="">— Seleccione —</option>' + estado.clientes.map((c) =>
      `<option value="${c.id}" ${c.id === elegir ? 'selected' : ''}>${esc(c.razon_social)}${c.rif ? ' · ' + esc(c.rif) : ''}</option>`).join('');
  };
  cargarClientes();
  if (conduce) {
    const { data } = await estado.sb.from('perfiles').select('id,nombre,auth_id').eq('activo', true).eq('rol', 'ventas').order('nombre');
    const sel = $('#r-vendedor'); if (sel) sel.innerHTML = (data?.length ? '<option value="">— Seleccione —</option>' : '<option value="">No hay personal con rol Ventas: agréguelo en Personal</option>') +
      (data || []).map((v) => `<option value="${v.id}">${esc(v.nombre)}${v.auth_id ? '' : ' (sin cuenta)'}</option>`).join('');
  }
  if (!$('#b-cliente-nuevo')) return;   // ya se navegó a otra pantalla
  $('#b-cliente-nuevo').addEventListener('click', () => dialogoCliente(null, (id) => cargarClientes(id)));

  $('#r-cliente').addEventListener('change', () => {
    const c = estado.clientes.find((x) => x.id === $('#r-cliente').value); if (!c) return;
    for (const [sel, v] of [['#r-cnombre', c.contacto_nombre], ['#r-ccargo', c.contacto_cargo], ['#r-ctel', c.contacto_telefono], ['#r-ccorreo', c.contacto_correo]]) {
      if (v && !$(sel).value.trim()) $(sel).value = v;

  });
  $('#f-req').addEventListener('input', () => { $('#msj').innerHTML = ''; });
  $('#f-req').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = $('#f-req');
    const faltan = [];
    if (conduce && !valor(f, '#r-vendedor')) faltan.push('vendedor');
    if (!valor(f, '#r-cliente')) faltan.push('cliente');
    if (valor(f, '#r-obra').length < 2) faltan.push('nombre de la obra');
    if (valor(f, '#r-dir').length < 3) faltan.push('dirección');
    if (!valor(f, '#r-edo')) faltan.push('estado');
    if (valor(f, '#r-ciudad').length < 2) faltan.push('ciudad');
    if (!valor(f, '#r-tsol')) faltan.push('tipo de solicitud');
    if (valor(f, '#r-desc').length < 5) faltan.push('descripción del alcance');
    const num = (sel) => valor(f, sel).replace(/\./g, '').replace(',', '.');
    for (const [sel, nombre] of [['#r-area', 'área'], ['#r-niveles', 'niveles'], ['#r-ppto', 'presupuesto']]) {
      if (valor(f, sel) && !(Number(num(sel)) > 0 || (sel === '#r-ppto' && Number(num(sel)) === 0))) faltan.push(nombre + ' (número válido)');
    }
    if (faltan.length) {
      $('#msj').innerHTML = `<div class="aviso aviso-error" role="alert">Complete: ${esc(faltan.join(', '))}.</div>`;
      $('#msj').scrollIntoView({ block: 'center' }); return;
    }
    const b = $('#b-registrar'); b.disabled = true; b.textContent = 'Registrando…';
    const ficha = {
      vendedor_id: conduce ? valor(f, '#r-vendedor') : null, canal: valor(f, '#r-canal'), cliente_id: valor(f, '#r-cliente'),
      contacto_nombre: valor(f, '#r-cnombre'), contacto_cargo: valor(f, '#r-ccargo'), contacto_telefono: valor(f, '#r-ctel'), contacto_correo: valor(f, '#r-ccorreo'),
      obra_nombre: valor(f, '#r-obra'), direccion: valor(f, '#r-dir'), estado_geo: valor(f, '#r-edo'), ciudad: valor(f, '#r-ciudad'),
      tipo_edificacion: valor(f, '#r-edif'), area_m2: num('#r-area'), niveles: num('#r-niveles'), contacto_sitio: valor(f, '#r-csitio'),
      tipo_solicitud: valor(f, '#r-tsol'), sistemas: marcadas(f, 'sistemas'), descripcion: valor(f, '#r-desc'),
      info_recibida: marcadas(f, 'info'), requiere_levantamiento: valor(f, '#r-lev') || null,
      fecha_requerida: valor(f, '#r-freq'), prioridad: valor(f, '#r-prio'), presupuesto_estimado_usd: num('#r-ppto'),
    };
    const { data, error } = await estado.sb.rpc('rpc_requerimiento_registrar', { p: ficha });
    if (error) {
      b.disabled = false; b.textContent = 'Registrar requerimiento';
      $('#msj').innerHTML = `<div class="aviso aviso-error" role="alert">${esc(mensajeError(error))}</div>`; $('#msj').scrollIntoView({ block: 'center' }); return;
    }
    toast(`Requerimiento ${data.codigo} registrado.`);
    ir('requerimientos', data.id);
  });
}

// ----------------------------------------------------------------------------- Requerimientos: ficha
async function detalleRequerimiento(p, id) {
  p.innerHTML = '<div class="vacio">Cargando…</div>';
  const [{ data: r, error }, { data: hist }] = await Promise.all([
    estado.sb.from('requerimientos').select('*, cliente:clientes(codigo,razon_social,rif), vendedor:perfiles!requerimientos_vendedor_id_fkey(nombre), ingeniero:perfiles!requerimientos_ingeniero_id_fkey(nombre)').eq('id', id).maybeSingle(),
    estado.sb.from('requerimiento_estados').select('estado_antes,estado_nuevo,motivo,en,perfil:perfiles(nombre)').eq('requerimiento_id', id).order('en'),
  ]);
  if (estado.param !== id) return;   // el usuario ya navegó a otra parte
  let rr = r, sinRed = false;
  if (error && esErrorDeRed(error)) { rr = await BD.get('reqs', id).catch(() => null); sinRed = !!rr; }
  else if (r) BD.put('reqs', r).catch(() => {});
  if (!rr) {
    p.innerHTML = `<button class="btn-texto" id="b-volver" type="button">${icono('volver')}Requerimientos</button>
      <div class="aviso aviso-alerta" style="margin-top:12px">${error ? esc(mensajeError(error)) : 'El requerimiento no existe o no tiene acceso a él.'}</div>`;
    $('#b-volver').addEventListener('click', () => ir('requerimientos')); return;
  }
  return pintarDetalleReq(p, rr, sinRed ? [] : hist, sinRed);
}

      <div style="display:flex;gap:8px;flex-wrap:wrap">

        ${sig.map((n) => `<button class="btn ${n === 'rechazado' ? 'btn-peligro' : 'btn-secundario'}" data-estado="${n}" type="button">${esc(ESTADOS_REQ[n][0])}</button>`).join('')}

    <div class="rejilla">
      <section class="tarjeta"><h2>Clasificación</h2><dl class="datos">
        ${fila('Modalidad', r.modalidad ? esc(MODALIDADES[r.modalidad]) : '<span style="color:var(--texto2)">Sin asignar</span>')}

        ${fila('Observaciones', esc(r.observaciones))}

      <section class="tarjeta"><h2>Origen y cliente</h2><dl class="datos">

        ${fila('Canal', esc(CANALES[r.canal]))}
        ${fila('Cliente', esc(r.cliente?.razon_social) + (r.cliente?.rif ? ' · ' + esc(r.cliente.rif) : ''))}
        ${fila('Contacto', esc([r.contacto_nombre, r.contacto_cargo].filter(Boolean).join(' · ')))}

        ${fila('Correo', esc(r.contacto_correo))}
      </dl></section>
      <section class="tarjeta"><h2>Obra / sitio</h2><dl class="datos">
        ${fila('Dirección', esc(r.direccion))}

        ${h.motivo ? `<div>${esc(h.motivo)}</div>` : ''}</li>`).join('')}</ol></section>`;

async function dialogoAsignar(r) {
  const { data: gente } = await estado.sb.from('perfiles').select('id,nombre,rol,disciplina').eq('activo', true).in('rol', ['ingeniero', 'coordinador']).order('nombre');
  abrirDialogo({
    titulo: `Asignar ${r.codigo}`, textoAceptar: 'Asignar',
    html: `<div class="campo"><label for="a-mod">Modalidad *</label><select id="a-mod">${opciones(MODALIDADES, r.modalidad || '', '— Seleccione —')}</select></div>
      <div class="campo"><label for="a-ing">Responsable *</label><select id="a-ing"><option value="">— Seleccione —</option>
        ${(gente || []).map((g) => `<option value="${g.id}" ${g.id === r.ingeniero_id ? 'selected' : ''}>${esc(g.nombre)}${g.disciplina ? ' · ' + esc(g.disciplina) : ''}</option>`).join('')}</select></div>
      <div class="campo"><label>Disciplinas</label>${casillas('disc', { HV: 'HV · HVAC mecánico', AU: 'AU · Automatización y controles' }, r.disciplinas || [])}</div>
      <div class="campo"><label for="a-fecha">Entrega comprometida</label><input id="a-fecha" type="date" value="${esc(r.fecha_compromiso || '')}"></div>
      <div class="campo"><label for="a-obs">Observaciones</label><textarea id="a-obs" rows="3">${esc(r.observaciones || '')}</textarea></div>`,
    alAceptar: async (d, err) => {
      if (!valor(d, '#a-mod')) { err('Seleccione la modalidad.'); return false; }
      if (!valor(d, '#a-ing')) { err('Seleccione el responsable.'); return false; }
      const { error } = await estado.sb.rpc('rpc_requerimiento_asignar', {
        p_id: r.id, p_modalidad: valor(d, '#a-mod'), p_ingeniero: valor(d, '#a-ing'), p_disciplinas: marcadas(d, 'disc'),
        p_fecha_compromiso: valor(d, '#a-fecha') || null, p_observaciones: valor(d, '#a-obs') || null });
      if (error) { err(mensajeError(error)); return false; }
      toast(`${r.codigo} asignado.`); ir('requerimientos', r.id); return true;
    },
  });
}

function dialogoEstado(r, nuevo) {
  const exige = ['rechazado', 'en_espera'].includes(nuevo);
  abrirDialogo({
    titulo: `${r.codigo}: ${ESTADOS_REQ[nuevo][0]}`, textoAceptar: 'Confirmar', peligro: nuevo === 'rechazado',
    html: `<p>El requerimiento pasa de <strong>${esc(ESTADOS_REQ[r.estado][0])}</strong> a <strong>${esc(ESTADOS_REQ[nuevo][0])}</strong>.</p>
      <div class="campo"><label for="e-motivo">${exige ? 'Motivo *' : 'Comentario'}</label><textarea id="e-motivo" rows="3"></textarea></div>`,
    alAceptar: async (d, err) => {
      const motivo = valor(d, '#e-motivo');
      if (exige && motivo.length < 3) { err('Indique el motivo.'); return false; }
      const { error } = await estado.sb.rpc('rpc_requerimiento_estado', { p_id: r.id, p_nuevo: nuevo, p_motivo: motivo || null });
      if (error) { err(mensajeError(error)); return false; }
      toast(`${r.codigo}: ${ESTADOS_REQ[nuevo][0]}.`); ir('requerimientos', r.id); return true;
    },
  });
}

async function vistaClientes(p) {
  const edita = tieneRol(REGISTRA_REQ);
  p.innerHTML = `<div class="cabecera-modulo"><div><h1>Clientes</h1><p>Catálogo propio del Departamento de Proyectos.</p></div>
      ${edita ? `<button class="btn btn-primario" id="b-cli-nuevo" type="button">${icono('mas')}Nuevo cliente</button>` : ''}</div>
    <div class="filtros"><input id="f-buscar" type="search" placeholder="Buscar por razón social, RIF o código" aria-label="Buscar"></div>
    <div class="tarjeta"><ul class="lista" id="l-cli"><li class="vacio">Cargando…</li></ul></div>`;
  $('#b-cli-nuevo')?.addEventListener('click', () => dialogoCliente(null, () => vistaClientes(p)));
  $('#f-buscar').addEventListener('input', () => pintarClientes(edita, p));
  const { data, error } = await estado.sb.from('clientes').select('*').order('razon_social');

// ----------------------------------------------------------------------------- almacenamiento local
// IndexedDB guarda en el teléfono lo necesario para trabajar sin señal: requerimientos
// asignados, levantamientos y fotos pendientes de subir. Todo lleva el uid de la cuenta:
// si en el equipo entra otra persona, se borra lo de la anterior.
const BD = {
  db: null,
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, mal) => {
      const r = indexedDB.open('sgp', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('reqs', { keyPath: 'id' });
        d.createObjectStore('lev', { keyPath: 'id' });
        d.createObjectStore('fotos', { keyPath: 'id' }).createIndex('lev', 'levantamiento_id');
        d.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => { this.db = r.result; ok(this.db); };
      r.onerror = () => mal(r.error);
    });
  },
  async op(almacen, modo, fn) {
    const d = await this.abrir();
    return new Promise((ok, mal) => {
      const t = d.transaction(almacen, modo); const s = t.objectStore(almacen);
      const r = fn(s); t.oncomplete = () => ok(r?.result); t.onerror = () => mal(t.error); t.onabort = () => mal(t.error);
    });
  },
  get(a, k) { return this.op(a, 'readonly', (s) => s.get(k)); },
  put(a, v) { return this.op(a, 'readwrite', (s) => s.put(v)); },
  del(a, k) { return this.op(a, 'readwrite', (s) => s.delete(k)); },
  todos(a) { return this.op(a, 'readonly', (s) => s.getAll()); },
  fotosDe(lev) { return this.op('fotos', 'readonly', (s) => s.index('lev').getAll(lev)); },
  async vaciar() { for (const a of ['reqs', 'lev', 'fotos', 'meta']) await this.op(a, 'readwrite', (s) => s.clear()); },
};

// Perfil guardado para abrir la aplicación sin señal
const PERFIL_LOCAL = 'sgp-perfil';
function guardarPerfilLocal(uid, perfil) { try { localStorage.setItem(PERFIL_LOCAL, JSON.stringify({ uid, perfil })); } catch { /* sin almacenamiento */ } }
function perfilLocal(uid) {
  try { const x = JSON.parse(localStorage.getItem(PERFIL_LOCAL) || 'null'); return x && (!uid || x.uid === uid) ? x : null; } catch { return null; }
}
const esErrorDeRed = (e) => !navigator.onLine || /Failed to fetch|NetworkError|Load failed|network|fetch/i.test(e?.message || String(e || '')) || e?.name === 'AuthRetryableFetchError';
async function asegurarDueno(uid) {
  try {
    const m = await BD.get('meta', 'uid');
    if (m && m.v !== uid) await BD.vaciar();
    await BD.put('meta', { k: 'uid', v: uid });
  } catch { /* IndexedDB no disponible: la app funciona, pero no sin señal */ }
}

// ----------------------------------------------------------------------------- sincronización
const sinc = { corriendo: null, temporizador: null, ultimoError: null };
function programarSinc(ms = 2500) { clearTimeout(sinc.temporizador); sinc.temporizador = setTimeout(() => sincronizar(), ms); }

async function pendientesLocales() {
  await volcarEdicion();
  try {
    const [levs, fotos] = await Promise.all([BD.todos('lev'), BD.todos('fotos')]);
    return { lev: levs.filter((l) => l.sucio || !l.codigo).length, fotos: fotos.filter((f) => !f.subida || f.descSucia || f.borrar).length,
             conflictos: levs.filter((l) => l.conflicto).length };
  } catch { return { lev: 0, fotos: 0, conflictos: 0 }; }
}

async function sincronizar() {
  if (sinc.corriendo) return sinc.corriendo;
  if (!navigator.onLine || !estado.perfil || estado.sinConexion) return;
  sinc.corriendo = (async () => {
    await volcarEdicion();
    pintarEstadoSinc('subiendo');
    try {
      for (const l of await BD.todos('lev')) {
        if (l.conflicto) continue;
        // 1. Registrar los iniciados sin señal: aquí reciben su código
        if (!l.codigo) {
          const { data, error } = await estado.sb.rpc('rpc_levantamiento_crear', { p_id: l.id, p_requerimiento: l.requerimiento_id, p_contenido: l.contenido });
          if (error) { if (esErrorDeRed(error)) throw error; l.errorSinc = mensajeError(error); await BD.put('lev', l); continue; }
          const actual = await BD.get('lev', l.id) || l;
          Object.assign(actual, { codigo: data.codigo, version: data.version, sucio: actual.sucio && actual.edicion !== l.edicion, errorSinc: null });
          await BD.put('lev', actual);
          toast(`Levantamiento registrado: ${data.codigo}`);
          continue;
        }
        // 2. Subir el contenido modificado
        if (l.sucio) {
          const { data, error } = await estado.sb.rpc('rpc_levantamiento_guardar', { p_id: l.id, p_contenido: l.contenido, p_version: l.version });
          const actual = await BD.get('lev', l.id) || l;
          if (error) {
            if (esErrorDeRed(error)) throw error;
            if (/^CONFLICTO/.test(error.message)) {
              const { data: srv } = await estado.sb.from('levantamientos').select('version,contenido').eq('id', l.id).maybeSingle();
              actual.conflicto = srv ? { version: srv.version, contenido: srv.contenido } : null;
            } else actual.errorSinc = mensajeError(error);
            await BD.put('lev', actual); continue;
          }
          actual.version = data; actual.errorSinc = null;
          if (actual.edicion === l.edicion) actual.sucio = false;   // si se editó durante la subida, queda pendiente
          await BD.put('lev', actual);
        }
      }
      // 3. Fotos: subir archivo, registrar ficha, borrar las quitadas
      const levs = Object.fromEntries((await BD.todos('lev')).map((l) => [l.id, l]));
      for (const f of await BD.todos('fotos')) {
        const l = levs[f.levantamiento_id];
        if (l && !l.codigo) continue;                 // primero debe existir el levantamiento en la base
        if (f.borrar) {
          if (f.subida) {
            const { error } = await estado.sb.rpc('rpc_foto_eliminar', { p_id: f.id });
            if (error) { if (esErrorDeRed(error)) throw error; continue; }
            await estado.sb.storage.from('levantamientos').remove([`${f.levantamiento_id}/${f.id}.jpg`]);
          }
          await BD.del('fotos', f.id); continue;
        }
        if (!f.subida || f.descSucia) {
          if (!f.subida) {
            const { error } = await estado.sb.storage.from('levantamientos')
              .upload(`${f.levantamiento_id}/${f.id}.jpg`, f.blob, { contentType: 'image/jpeg', upsert: true });
            if (error) { if (esErrorDeRed(error)) throw error; f.errorSinc = mensajeError(error); await BD.put('fotos', f); continue; }
          }
          const { error } = await estado.sb.rpc('rpc_foto_registrar', { p: {
            id: f.id, levantamiento_id: f.levantamiento_id, seccion: f.seccion, referencia: f.referencia, descripcion: f.descripcion,
            tomada_en: f.tomada_en, latitud: f.latitud, longitud: f.longitud, bytes: f.bytes, ancho: f.ancho, alto: f.alto } });
          if (error) { if (esErrorDeRed(error)) throw error; f.errorSinc = mensajeError(error); await BD.put('fotos', f); continue; }
          const actual = await BD.get('fotos', f.id);
          if (actual) { actual.subida = true; actual.errorSinc = null; if (actual.descripcion === f.descripcion) actual.descSucia = false; await BD.put('fotos', actual); }
        }
      }
      sinc.ultimoError = null;
    } catch (e) { sinc.ultimoError = e; }
    finally { sinc.corriendo = null; await pintarEstadoSinc(); refrescarEditorTrasSinc(); }
  })();
  return sinc.corriendo;
}

async function pintarEstadoSinc(fase) {
  const caja = $('#estado-sinc'); if (!caja) return;
  if (fase === 'subiendo') { caja.className = 'estado-sinc subiendo'; caja.textContent = 'Subiendo al servidor…'; return; }
  const p = await pendientesLocales();
  const n = p.lev + p.fotos;
  if (p.conflictos) { caja.className = 'estado-sinc error'; caja.textContent = 'Hay un conflicto de versiones: revise el levantamiento.'; }
  else if (!n) { caja.className = 'estado-sinc ok'; caja.textContent = 'Todo guardado en el servidor'; }
  else {
    caja.className = 'estado-sinc pendiente';
    caja.textContent = `Guardado en este equipo · ${p.lev ? p.lev + ' levantamiento(s)' : ''}${p.lev && p.fotos ? ' y ' : ''}${p.fotos ? p.fotos + ' foto(s)' : ''} por subir${navigator.onLine ? '' : ' cuando haya señal'}`;
  }
}

// ----------------------------------------------------------------------------- fotos: captura
async function reducirFoto(archivo) {
  const bmp = await createImageBitmap(archivo, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(archivo));
  const lado = 1600, k = Math.min(1, lado / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const comoBlob = (q) => new Promise((ok) => c.toBlob(ok, 'image/jpeg', q));
  let b = await comoBlob(0.72);
  if (b.size > 450000) b = await comoBlob(0.6);
  return { blob: b, ancho: c.width, alto: c.height };
}
// Nunca bloquea: si el permiso no se responde o el GPS tarda, sigue sin coordenadas.
function ubicacionActual(espera = 7000) {
  return new Promise((ok) => {
    if (!navigator.geolocation) return ok(null);
    setTimeout(() => ok(null), espera + 500);
    navigator.geolocation.getCurrentPosition((p) => ok({ lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), precision: Math.round(p.coords.accuracy) }),
      () => ok(null), { enableHighAccuracy: true, timeout: espera, maximumAge: 120000 });
  });
}
async function agregarFotos(L, archivos, seccion, referencia) {
  const gps = await ubicacionActual(4000);
  for (const a of archivos) {
    try {
      const r = await reducirFoto(a);
      await BD.put('fotos', { id: nuevoId(), levantamiento_id: L.id, seccion, referencia: referencia || null, descripcion: '',
        tomada_en: new Date(a.lastModified || Date.now()).toISOString(), latitud: gps?.lat ?? null, longitud: gps?.lon ?? null,
        bytes: r.blob.size, ancho: r.ancho, alto: r.alto, blob: r.blob, subida: false });
    } catch { toast('No se pudo procesar una de las fotos.', 'error'); }
  }
  programarSinc(800);
}

async function cargarFotosEditor(enLinea) {
  const L = ed.L;
  const locales = await BD.fotosDe(L.id).catch(() => []);
  let servidor = [];
  if (enLinea && L.codigo) {
    const { data } = await estado.sb.from('levantamiento_fotos').select('id,ruta,seccion,referencia,descripcion,tomada_en,latitud,longitud').eq('levantamiento_id', L.id);
    servidor = data || [];

  const porId = new Map(servidor.map((f) => [f.id, { ...f, subida: true }]));
  for (const f of locales) porId.set(f.id, { ...(porId.get(f.id) || {}), ...f });
  ed.fotos = [...porId.values()].filter((f) => !f.borrar).sort((a, b) => (a.tomada_en || '').localeCompare(b.tomada_en || ''));
  const faltan = ed.fotos.filter((f) => !f.blob && !ed.urls[f.id]).map((f) => `${L.id}/${f.id}.jpg`);
  if (faltan.length && enLinea) {

}

// Guardado: cada cambio va primero al teléfono y luego, si hay señal, al servidor
function marcarCambio() {
  const L = ed.L; L.sucio = true; L.edicion = (L.edicion || 0) + 1;
  clearTimeout(ed.guardarT);
  ed.guardarT = setTimeout(() => volcarEdicion().then(() => { pintarEstadoSinc(); programarSinc(3000); }), 400);

// Escribe ya en el teléfono lo que se está editando (antes de sincronizar o de salir)
async function volcarEdicion() {

  await BD.put('lev', ed.L).catch(() => {});
}
function fijar(obj, ruta, v) { const k = ruta.split('.'); let o = obj; for (const x of k.slice(0, -1)) o = o[x] = o[x] || {}; o[k.at(-1)] = v; }
function leer(obj, ruta) { return ruta.split('.').reduce((o, x) => (o ? o[x] : undefined), obj); }

function enlazarPaso(f, edita) {
  if (!f) return;
  const c = ed.L.contenido;
  const objetivo = (el) => { const l = el.dataset.l; return l ? (c[l] || []).find((x) => x.id === el.dataset.i) : c; };
  f.addEventListener('input', (ev) => {
    const el = ev.target; if (!el.dataset.c || !edita) return;
    const o = objetivo(el); if (!o) return;
    if (el.type === 'checkbox') {
      const grupo = [...f.querySelectorAll(`input[type=checkbox][data-c="${el.dataset.c}"]${el.dataset.i ? `[data-i="${el.dataset.i}"]` : ''}`)];
      fijar(o, el.dataset.c, grupo.filter((x) => x.checked).map((x) => x.value));
    } else fijar(o, el.dataset.c, el.value);
    marcarCambio();
    if (el.dataset.c === 'largo' || el.dataset.c === 'ancho') {
      const s = f.querySelector(`[data-m2="${el.dataset.i}"]`); const a = num(o.largo) !== null && num(o.ancho) !== null ? num(o.largo) * num(o.ancho) : null;
      if (s) s.textContent = a === null ? '—' : fmtNum(a) + ' m²';
    }
    if (el.dataset.c === 'tipo') pintarEditor();
    if (el.dataset.c === 'nombre' && el.dataset.l === 'areas') { /* las listas de áreas se actualizan al cambiar de paso */ }
  });
  f.addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-accion]'); if (!b || !edita) return;
    ev.preventDefault();
    const lista = b.dataset.l;
    if (b.dataset.accion === 'agregar') {
      c[lista] = c[lista] || [];
      const item = { id: idCorto() };
      if (lista === 'equipos') item.tag = 'EQ-' + pad2(c.equipos.length + 1);
      c[lista].push(item); ed.abierto = item.id; marcarCambio(); pintarEditor();
      setTimeout(() => $(`[data-i="${item.id}"]`)?.focus(), 30);
    } else if (b.dataset.accion === 'quitar') {
      const item = (c[lista] || []).find((x) => x.id === b.dataset.i);
      const n = ed.fotos.filter((x) => x.referencia === b.dataset.i).length;
      abrirDialogo({ titulo: '¿Quitar este elemento?', textoAceptar: 'Quitar', peligro: true,
        html: `<p>Se quita «${esc(item?.nombre || item?.tag || item?.descripcion || item?.texto || item?.instrumento || 'sin nombre')}»${n ? ` y sus ${n} foto(s)` : ''}.</p>`,
        alAceptar: async () => {
          c[lista] = c[lista].filter((x) => x.id !== b.dataset.i);
          for (const fo of ed.fotos.filter((x) => x.referencia === b.dataset.i)) await quitarFoto(fo.id, true);
          marcarCambio(); pintarEditor(); return true;
        } });
    } else if (b.dataset.accion === 'gps') {
      b.disabled = true; b.textContent = 'Obteniendo ubicación…';
      const g = await ubicacionActual(15000);
      if (!g) { toast('No se pudo obtener la ubicación. Revise el permiso de ubicación del navegador.', 'error'); pintarEditor(); return; }
      c.visita = c.visita || {}; c.visita.gps = { ...g, en: new Date().toISOString() }; marcarCambio(); pintarEditor();
    } else if (b.dataset.accion === 'quitar-foto') {
      abrirDialogo({ titulo: `¿Quitar la foto F-${numeroFoto(b.dataset.foto)}?`, textoAceptar: 'Quitar', peligro: true, html: '<p>La numeración de las demás fotos se ajusta.</p>',
        alAceptar: async () => { await quitarFoto(b.dataset.foto); pintarEditor(); return true; } });
    }
  });
  // Descripción de cada foto
  f.addEventListener('change', async (ev) => {
    const el = ev.target;
    if (el.dataset.desc && edita) {
      const fo = ed.fotos.find((x) => x.id === el.dataset.desc); if (!fo) return;
      fo.descripcion = el.value.trim();
      const local = await BD.get('fotos', fo.id).catch(() => null);
      await BD.put('fotos', { ...(local || fo), descripcion: fo.descripcion, descSucia: true, subida: local ? local.subida : true }).catch(() => {});
      programarSinc(2000); pintarEstadoSinc();
    }
    if (el.type === 'file' && el.files?.length && edita) {
      const n = el.files.length; el.disabled = true;
      toast(`Procesando ${n} foto(s)…`, 'info');
      await agregarFotos(ed.L, [...el.files], el.dataset.seccion, el.dataset.ref);
      await cargarFotosEditor(false); pintarEditor();
    }
  });
  f.querySelectorAll('details[data-i]').forEach((d) => d.addEventListener('toggle', () => { if (d.open) ed.abierto = d.dataset.i; }));
}

async function quitarFoto(id, silencio) {
  const fo = ed.fotos.find((x) => x.id === id); if (!fo) return;
  const local = await BD.get('fotos', id).catch(() => null);
  if (local && !local.subida) await BD.del('fotos', id).catch(() => {});
  else await BD.put('fotos', { ...(local || fo), borrar: true }).catch(() => {});
  ed.fotos = ed.fotos.filter((x) => x.id !== id);
  if (!silencio) toast('Foto quitada.');
  programarSinc(1000);
}

function bloqueFotos(seccion, ref, titulo = 'Fotos') {
  const lista = ed.fotos.filter((f) => f.seccion === seccion && (f.referencia || null) === (ref || null));
  const edita = puedeEditarLev(ed.L);
  return `<div class="bloque-fotos"><div class="titulo-fotos">${esc(titulo)} <span class="ayuda">(${lista.length})</span></div>
    <div class="fotos">${lista.map((f) => `<figure class="foto">
      ${ed.urls[f.id] ? `<img src="${esc(ed.urls[f.id])}" alt="Foto F-${numeroFoto(f.id)}" loading="lazy">` : '<div class="sin-img">Sin vista previa</div>'}
      <figcaption><span class="nfoto">F-${numeroFoto(f.id)}${f.subida ? '' : ' · <span title="Pendiente de subir">⏳</span>'}</span>
        <input data-desc="${f.id}" value="${esc(f.descripcion || '')}" placeholder="Descripción" aria-label="Descripción de la foto F-${numeroFoto(f.id)}">
        ${edita ? `<button class="btn-texto peligro" type="button" data-accion="quitar-foto" data-foto="${f.id}">Quitar</button>` : ''}</figcaption></figure>`).join('')}</div>

}

}

        <div class="dos-columnas">${s('Refrigerante', 'refrigerante', REFRIGERANTES)}${s('Área servida', 'area_id', areas)}</div>
        ${c.tipo === 'mixto' ? s('Destino', 'destino', DESTINOS) : ''}
        ${f('Observación', 'observacion', { area: true, filas: 2 })}
        ${bloqueFotos('equipo', e.id)}`);
    }).join('');
    return `${Object.keys(areas).length ? '' : '<div class="aviso aviso-alerta">Registre primero las áreas (paso 3) para indicar el área servida.</div>'}
      ${lista || '<p class="vacio">Todavía no hay equipos.</p>'}${botonAgregar('equipos', 'Agregar equipo')}`;
  },
  facilidades(c) {
    const x = c.facilidades || {};
    const f = (etq, campo, extra = {}) => campoTxt(etq, 'facilidades.' + campo, leer(x, campo), extra);
    const s = (etq, campo, dic) => campoSel(etq, 'facilidades.' + campo, dic, leer(x, campo));
    return `<h3>Electricidad</h3>
      <div class="dos-columnas">${f('Tablero disponible', 'electrica.tablero', { ph: 'Ubicación e identificación' })}${f('Tensión y fases', 'electrica.tension', { ph: 'p. ej., 208 V · 3F' })}</div>

      ${f('Observaciones eléctricas', 'electrica.observacion', { area: true, filas: 2 })}
      <h3>Sitio</h3>
      ${f('Rutas para tuberías y ductos', 'rutas', { area: true, filas: 2 })}
      ${f('Ubicación posible de equipos', 'ubicacion_equipos', { area: true, filas: 2 })}
      <div class="dos-columnas">${f('Drenajes', 'drenajes')}${f('Acceso a techo o estructura', 'acceso_techo')}</div>
      ${c.tipo !== 'existente' ? `<div class="dos-columnas">${s('Estado de la obra', 'estado_obra', ESTADOS_OBRA)}${s('¿El sitio coincide con los planos del cliente?', 'coincide_planos', COINCIDE)}</div>` : ''}
      ${f('Otras observaciones', 'observaciones', { area: true, filas: 3 })}
      ${bloqueFotos('facilidades', null)}`;
  },
  mediciones(c) {
    const lista = (c.instrumentos || []).map((x) => {

        `<div class="dos-columnas">${f('Instrumento', 'instrumento')}${f('Marca / modelo', 'marca_modelo')}</div>

  hallazgos(c, t) {

      `${campoTxt(t.hallazgo, 'descripcion', h.descripcion, { area: true, filas: 3, l: 'hallazgos', i: h.id })}

    return `${ES_NUEVA(c.tipo) ? '<p class="ayuda">Condiciones del sitio que afectan el diseño, p. ej., «sin espacio en techo para condensadoras», «tablero sin capacidad disponible».</p>' : ''}

// Paso 9: lista de comprobación, informe y envío
async function pasoRevisionDespues() {
  const caja = $('#revision-lev'); if (!caja) return;
  const L = ed.L, c = L.contenido, t = titulosLev(c.tipo), pend = await pendientesLocales();
  const pendLev = L.sucio || !L.codigo, pendFotos = (await BD.fotosDe(L.id).catch(() => [])).filter((f) => !f.subida || f.descSucia || f.borrar).length;
  const sinDesc = ed.fotos.filter((f) => !f.descripcion).length;
  const chequeo = [
    [!!c.visita?.fecha, 'Fecha de la visita (paso 1)', true],
    [(c.areas || []).length > 0, 'Al menos un área (paso 3)', true],
    [(c.areas || []).every((a) => a.nombre), 'Todas las áreas con nombre', false],
    [ed.fotos.length > 0, `Registro fotográfico (${ed.fotos.length} foto(s))`, false],
    [!sinDesc, sinDesc ? `${sinDesc} foto(s) sin descripción` : 'Todas las fotos con descripción', false],
    [!!c.analisis, t.analisis + ' (paso 8)', false],
    [!pendLev && !pendFotos, pendLev || pendFotos ? 'Hay cambios o fotos sin subir al servidor' : 'Todo subido al servidor', true],
  ];
  if (!caja.isConnected) return;    // la pantalla se volvió a pintar mientras se revisaba
  const listo = chequeo.every(([ok, , oblig]) => ok || !oblig);
  const edita = puedeEditarLev(L), revisa = tieneRol(CONDUCE) && L.estado === 'en_revision';
  caja.innerHTML = `<ul class="chequeo">${chequeo.map(([ok, txt, oblig]) => `<li class="${ok ? 'ok' : oblig ? 'falta' : 'aviso'}">${ok ? '✓' : oblig ? '✗' : '!'} ${esc(txt)}${!ok && oblig ? ' <span class="ayuda">(obligatorio)</span>' : ''}</li>`).join('')}</ul>
    <div class="botones-revision">
      <button class="btn btn-secundario" id="b-pdf" type="button">${icono('documento')}Descargar informe PDF${L.estado === 'aprobado' ? '' : ' (borrador)'}</button>
      ${edita ? `<button class="btn btn-primario" id="b-enviar-lev" type="button" ${listo && navigator.onLine ? '' : 'disabled'}>Enviar a revisión</button>` : ''}
      ${revisa ? `<button class="btn btn-primario" id="b-aprobar-lev" type="button">Aprobar</button><button class="btn btn-peligro" id="b-devolver-lev" type="button">Devolver</button>` : ''}
    </div>
    ${edita && !navigator.onLine ? '<p class="ayuda">Para enviar a revisión se necesita señal.</p>' : ''}
    ${ed.hist.length ? `<h3 style="margin-top:18px">Historial</h3><ol class="historial">${ed.hist.map((h) => `<li><strong>${esc(ESTADOS_LEV[h.estado_nuevo]?.[0] || h.estado_nuevo)}</strong>
      <div class="detalle" style="color:var(--texto2)">${esc(fmtFechaHora(h.en))}${h.perfil ? ' · ' + esc(h.perfil.nombre) : ''}</div>${h.motivo ? `<div>${esc(h.motivo)}</div>` : ''}</li>`).join('')}</ol>` : ''}`;
  void pend;
  caja.querySelector('#b-pdf').addEventListener('click', async (ev) => {
    const b = ev.currentTarget; b.disabled = true; const txt = b.innerHTML; b.textContent = 'Preparando el PDF…';
    try { await generarInformePDF(ed.L, ed.fotos); } catch (e) { toast('No se pudo generar el PDF: ' + (e.message || e), 'error'); }
    b.disabled = false; b.innerHTML = txt;
  });
  caja.querySelector('#b-enviar-lev')?.addEventListener('click', () => abrirDialogo({ titulo: `Enviar ${L.codigo} a revisión`, textoAceptar: 'Enviar',
    html: '<p>La coordinación recibirá un aviso. Mientras esté en revisión no se puede modificar.</p>',
    alAceptar: async (d, err) => {
      await sincronizar();
      const { error } = await estado.sb.rpc('rpc_levantamiento_enviar', { p_id: L.id });
      if (error) { err(mensajeError(error)); return false; }
      toast(`${L.codigo} enviado a revisión.`); editorLevantamiento($('#principal'), L.id); return true;
    } }));
  const revisar = (aprobar) => abrirDialogo({ titulo: `${aprobar ? 'Aprobar' : 'Devolver'} ${L.codigo}`, textoAceptar: aprobar ? 'Aprobar' : 'Devolver', peligro: !aprobar,
    html: `<div class="campo"><label for="r-obs">${aprobar ? 'Comentario' : 'Observaciones *'}</label><textarea id="r-obs" rows="4"></textarea></div>`,
    alAceptar: async (d, err) => {
      const obs = valor(d, '#r-obs');
      if (!aprobar && obs.length < 3) { err('Indique las observaciones.'); return false; }
      const { error } = await estado.sb.rpc('rpc_levantamiento_revisar', { p_id: L.id, p_aprobar: aprobar, p_observaciones: obs || null });
      if (error) { err(mensajeError(error)); return false; }
      toast(`${L.codigo}: ${aprobar ? 'aprobado' : 'devuelto'}.`); editorLevantamiento($('#principal'), L.id); return true;
    } });
  caja.querySelector('#b-aprobar-lev')?.addEventListener('click', () => revisar(true));
  caja.querySelector('#b-devolver-lev')?.addEventListener('click', () => revisar(false));
}

// ----------------------------------------------------------------------------- informe PDF (RFA-PRY-FOR-002)
// Se arma en el propio equipo con pdfmake (cargado solo al pedir el PDF). Replica la plantilla
// «Informe de Levantamiento de Campo» aprobada: portada, encabezado y pie en cada página,
// control del documento, secciones 1 a 10 y firmas EN BLANCO (el sistema no firma por nadie).
let pdfCargado = null;
function cargarPdfmake() {
  const script = (src) => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('no se pudo cargar ' + src)); document.head.appendChild(s); });
  pdfCargado = pdfCargado || script('vendor/pdfmake-0.2.20.min.js').then(() => script('vendor/pdf-fuentes.js')).then(() => {
    window.pdfMake.fonts = { SGPTexto: { normal: 'SGPTexto-Regular.ttf', bold: 'SGPTexto-Bold.ttf', italics: 'SGPTexto-It.ttf', bolditalics: 'SGPTexto-BoldIt.ttf' } };
  }).catch((e) => { pdfCargado = null; throw e; });
  return pdfCargado;
}
const comoDataURL = (blob) => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => mal(r.error); r.readAsDataURL(blob); });

async function generarInformePDF(L, fotos) {

  const c = L.contenido, v = c.visita || {}, t = titulosLev(c.tipo), nueva = ES_NUEVA(c.tipo), mixto = c.tipo === 'mixto';
  const aprobado = L.estado === 'aprobado';

  const imgs = {};

  });
  const cargas = (c.areas || []).map((a) => [a.nombre || '', (a.orientacion || []).join(', '), a.paredes_sol || '', a.techos_sol || '',
